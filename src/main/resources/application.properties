spring.application.name=supermercado-mcp

# --- Servidor MCP (Streamable HTTP, endpoint /mcp) ---
spring.ai.mcp.server.name=supermercado-mcp
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.stdio=false

server.port=8089

logging.file.name=./logs/supermercado.log
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG

# --- Base de datos (la contrasena viene de la variable de entorno PWD_UDEA) ---
spring.datasource.url=jdbc:mysql://localhost:3306/supermercado?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate: Hibernate solo comprueba que las entidades coincidan con las tablas (no crea nada)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false